usage.synopsisHeading = Usage:\u0020
usage.descriptionHeading = %n
usage.optionListHeading = %nOptions:%n
usage.description = Extracts signs from SignSuisse and saves them in one bundle per category.
output = Directory where the bundles are written (default: ${DEFAULT-VALUE}).
category = Categories to extract, all by default: ${COMPLETION-CANDIDATES}.
language = Sign languages to extract, all by default: ${COMPLETION-CANDIDATES}.
medias = Media to download: ${COMPLETION-CANDIDATES} (default: all). The others are only referenced by their address.
noMedia = Do not download videos and images, only their addresses (as --medias none).
interval = Minimum delay between two requests to SignSuisse, in milliseconds (default: ${DEFAULT-VALUE}).
help = Shows this help and exits.

error.unknownCategory = Unknown category: {0}
error.unknownLanguage = Unknown language: {0}
error.unknownMedia = Unknown media choice: {0} ({1})

progress.start = Category {0} ({1})…
progress.enumerated = {0} ({1}): {2} signs found in {3} searches
progress.incomplete = Warning: the search may have missed signs of the category {0} ({1}).
progress.failed = Failed for {0} ({1}): {2}
progress.done = Category {0}: {1} signs written to {2}
progress.failures = {0} signs could not be extracted.

media.ALL = all
media.VIDEOS = videos
media.IMAGES = images
media.NONE = none
