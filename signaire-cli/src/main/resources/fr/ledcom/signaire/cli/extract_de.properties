usage.description = Extrahiert Gebärden aus SignSuisse und speichert sie in einem Bundle pro Kategorie.
output = Verzeichnis, in das die Bundles geschrieben werden (Standard: ${DEFAULT-VALUE}).
category = Zu extrahierende Kategorien, standardmässig alle: ${COMPLETION-CANDIDATES}.
language = Zu extrahierende Gebärdensprachen, standardmässig alle: ${COMPLETION-CANDIDATES}.
medias = Herunterzuladende Medien: ${COMPLETION-CANDIDATES} (Standard: alle). Die anderen werden nur über ihre Adresse referenziert.
noMedia = Videos und Bilder nicht herunterladen, nur ihre Adressen (wie --medias keine).
interval = Minimaler Abstand zwischen zwei Anfragen an SignSuisse, in Millisekunden (Standard: ${DEFAULT-VALUE}).
refresh = Alle Gebärden erneut von SignSuisse lesen, statt die der bestehenden Bündel zu übernehmen.
help = Zeigt diese Hilfe an und beendet das Programm.

