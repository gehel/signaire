usage.description = Estrae segni da SignSuisse e li salva in un bundle per categoria.
output = Cartella in cui scrivere i bundle (predefinito: ${DEFAULT-VALUE}).
category = Categorie da estrarre, tutte per impostazione predefinita: ${COMPLETION-CANDIDATES}.
language = Lingue dei segni da estrarre, tutte per impostazione predefinita: ${COMPLETION-CANDIDATES}.
medias = Media da scaricare: ${COMPLETION-CANDIDATES} (predefinito: tutti). Gli altri sono referenziati solo dal loro indirizzo.
noMedia = Non scaricare video e immagini, solo i loro indirizzi (come --medias nessuno).
interval = Intervallo minimo tra due richieste a SignSuisse, in millisecondi (predefinito: ${DEFAULT-VALUE}).
help = Mostra questo aiuto ed esce.

