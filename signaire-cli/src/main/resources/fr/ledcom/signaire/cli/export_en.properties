usage.synopsisHeading = Usage:\u0020
usage.descriptionHeading = %n
usage.parameterListHeading = %nParameters:%n
usage.optionListHeading = %nOptions:%n
usage.description = Exports the results of a search as a printable PDF, an Anki deck or an e-book (EPUB). Videos and images come from the bundles.
words = Words to search for; without words, all the signs.
language = Sign languages, all by default: ${COMPLETION-CANDIDATES}.
category = Categories, all by default: ${COMPLETION-CANDIDATES}.
format = Format: ${COMPLETION-CANDIDATES}.
output = File to write.
title = Title of the document (default: the words searched for).
paper = Paper size (PDF): ${COMPLETION-CANDIDATES} (default: ${DEFAULT-VALUE}).
perPage = Signs per page (PDF): 1, 2, 4, 6, 8, 9 or 12 (default: ${DEFAULT-VALUE}).
layout = Layout (PDF): ${COMPLETION-CANDIDATES} (default: sheets). The booklet is folded, the flashcards are cut.
withVideos = Include the videos in the book (EPUB).
bundles = Directory of the bundles, for the videos and images (default: ${DEFAULT-VALUE}).
max = Maximum number of signs (default: ${DEFAULT-VALUE}).
help = Shows this help and exits.

export.defaultTitle = Signaire
export.done = {0,choice,0#No sign exported|1#1 sign exported|1<{0,number,integer} signs exported} to {1}
error.unknownLayout = Unknown layout: {0}
error.perPage = Impossible number of signs per page: {0}. Choose 1, 2, 4, 6, 8, 9 or 12.
layout.SHEETS = sheets
layout.BOOKLET = booklet
layout.FLASHCARDS = flashcards
