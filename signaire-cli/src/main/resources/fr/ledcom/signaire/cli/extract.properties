usage.synopsisHeading = Utilisation :\u0020
usage.descriptionHeading = %n
usage.optionListHeading = %nOptions :%n
usage.description = Extrait des signes de SignSuisse et les enregistre dans un bundle par catégorie.
output = Répertoire où écrire les bundles (défaut : ${DEFAULT-VALUE}).
category = Catégories à extraire, toutes par défaut : ${COMPLETION-CANDIDATES}.
language = Langues des signes à extraire, toutes par défaut : ${COMPLETION-CANDIDATES}.
medias = Médias à télécharger : ${COMPLETION-CANDIDATES} (défaut : tous). Les autres ne sont référencés que par leur adresse.
noMedia = Ne pas télécharger les vidéos et images, seulement leurs adresses (comme --medias aucun).
interval = Délai minimal entre deux requêtes à SignSuisse, en millisecondes (défaut : ${DEFAULT-VALUE}).
refresh = Relire tous les signes sur SignSuisse, plutôt que reprendre ceux des bundles existants.
help = Affiche cette aide et quitte.

