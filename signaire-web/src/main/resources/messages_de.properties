    zum Video), Anki-Stapel zum Wiederholen oder E-Book.
tour.requests.title=Hilfe finden
tour.requests.text=Die Schaltfläche «?» neben jeder Funktion führt zur Hilfe. Und wenn eine Gebärde fehlt, fragen Sie die Verwaltung.

