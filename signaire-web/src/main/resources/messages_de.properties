tour.welcome.title=Willkommen bei Signaire
tour.welcome.text=Signaire hilft Ihnen, die Gebärdensprachen der Schweiz mit dem SignSuisse-Lexikon zu lernen: Gebärden \
    suchen, ansehen, in Listen sammeln, drucken oder mit Anki wiederholen.
