tour.next=Next
tour.finish=Finish
tour.skip=Leave the tour
tour.search.title=Search signs
tour.search.text=Type a word: signs appear as you type. Filter by sign language (LSF, DSGS, LIS) or by category.
tour.signs.title=Watch a sign
tour.signs.text=The page of a sign shows its video, its images, its definition, examples and regional variants, with a link to SignSuisse.
tour.lists.title=Gather signs in lists
tour.lists.text=With an account, keep the signs you learn in your lists: from the page of a sign, or several at once from search results.
tour.exports.title=Print and review
tour.exports.text=Export a list or a search: printable PDF (sheets, booklet, flashcards with a QR code to the video), Anki deck to review, or e-book.
tour.requests.title=Find help
tour.requests.text=The "?" button next to each feature leads to the help. And if a sign is missing, ask the administrators.

