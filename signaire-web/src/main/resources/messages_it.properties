tour.title=Visita guidata
tour.welcome.title=Benvenuto su Signaire
tour.welcome.text=Signaire ti aiuta a imparare le lingue dei segni della Svizzera con il lessico SignSuisse: cercare \
    segni, guardarli, raccoglierli in liste, stamparli o ripassarli con Anki.
tour.start=Fai la visita (5 passi)
tour.dismiss=No grazie
tour.readMore=Per saperne di più
tour.previous=Indietro
tour.next=Avanti
tour.finish=Fine
tour.skip=Esci dalla visita
tour.search.title=Cercare segni
tour.search.text=Scrivi una parola: i segni appaiono mentre scrivi. Filtra per lingua dei segni (LSF, DSGS, LIS) o per categoria.
tour.signs.title=Guardare un segno
tour.signs.text=La pagina di un segno mostra il suo video, le immagini, la definizione, esempi e varianti regionali, con un link a SignSuisse.
tour.lists.title=Raccogliere segni in liste
tour.lists.text=Con un account, tieni i segni che impari nelle tue liste: dalla pagina di un segno, o più alla volta dai risultati di una ricerca.
tour.exports.title=Stampare e ripassare
tour.exports.text=Esporta una lista o una ricerca: PDF da stampare (fogli, libretto, schede con codice QR verso il \
    video), mazzo Anki per ripassare o libro elettronico.
tour.requests.title=Trovare aiuto
tour.requests.text=Il pulsante «?» accanto a ogni funzione porta all'aiuto. E se manca un segno, chiedilo all'amministrazione.

