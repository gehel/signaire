# The supported UI languages are configured in LocaleConfiguration.
spring.messages.fallback-to-system-locale=false

# Bundles made by "signaire extraire": loaded into Elasticsearch at startup, and the source of the media.
signaire.bundles.directory=bundles
signaire.bundles.load-on-startup=true
# Number of signs per page of search results
signaire.web.page-size=20

# Accounts and word lists: PostgreSQL, started by "docker compose up -d" for development
spring.datasource.url=jdbc:postgresql://localhost:5432/signaire
spring.datasource.username=signaire
spring.datasource.password=signaire
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Whether anyone can create an account
signaire.accounts.registration-enabled=true
# Bundles uploaded by administrators can be big
spring.servlet.multipart.max-file-size=4GB
spring.servlet.multipart.max-request-size=4GB
# Minimum delay between two requests to SignSuisse, when synchronizing
signaire.sync.interval=500ms
# Comma separated usernames of the administrators
signaire.accounts.admins=
