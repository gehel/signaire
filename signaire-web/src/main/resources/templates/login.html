<!DOCTYPE html>
<html th:lang="${#locale.language}" th:data-theme="${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{login.title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main" class="account">
    <h1 th:text="#{login.title}">Log in</h1>
    <p><a th:href="@{/help/account}" th:text="#{help.account}">About accounts</a></p>
    <p th:if="${param.registered}" class="success" th:text="#{login.registered}">Your account is created.</p>
    <p th:if="${param.error}" class="error" role="alert" th:text="#{login.error}">Wrong username or password.</p>
    <form th:action="@{/login}" method="post" class="stacked">
        <label for="username" th:text="#{account.username}">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        <label for="password" th:text="#{account.password}">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit" th:text="#{login.submit}">Log in</button>
    </form>
    <ul th:unless="${oidcProviders.isEmpty()}" class="oidc">
        <li th:each="provider : ${oidcProviders}">
            <a th:href="@{/oauth2/authorization/{id}(id=${provider.id()})}"
               th:text="#{login.with(${provider.name()})}">Log in with Example</a>
        </li>
    </ul>
    <p th:if="${registrationEnabled}">
        <span th:text="#{login.noAccount}">No account yet?</span>
        <a th:href="@{/register}" th:text="#{register.title}">Create an account</a>
    </p>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
