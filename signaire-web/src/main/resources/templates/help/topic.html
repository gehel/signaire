<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${page.title()})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main" class="help">
    <p><a th:href="@{/help}" th:text="#{help.title}">Help</a></p>
    <article>
        <h1 th:text="${page.title()}">Search</h1>
        <!--/* The manual is part of the application: its Markdown is trusted */-->
        <div th:utext="${page.html()}"></div>
    </article>
    <nav class="help-topics" th:aria-label="#{help.title}">
        <ul>
            <li th:each="other : ${pages}">
                <a th:href="@{/help/{topic}(topic=${other.topic()})}" th:text="${other.title()}"
                   th:attr="aria-current=${other.topic() == page.topic()} ? 'page' : null">Search</a>
            </li>
        </ul>
    </nav>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
