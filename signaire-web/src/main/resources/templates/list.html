<!DOCTYPE html>
<html th:lang="${#locale.language}" th:data-theme="${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${list.name()})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main">
    <p class="back"><a th:href="@{/lists}" th:text="#{lists.title}">My lists</a></p>
    <h1 th:text="${list.name()}">Family</h1>
    <p class="count" th:text="#{lists.size(${list.size()})}">2 signs</p>
    <p th:if="${missing > 0}" class="note" th:text="#{lists.missing(${missing})}">Missing signs: 1.</p>
    <p th:if="${list.size() == 0}" th:text="#{lists.empty}">This list is empty.</p>
    <ul class="signs">
        <li th:each="sign : ${signs}">
            <a class="name" th:lang="${sign.language().code()}" th:href="@{/signs/{uid}(uid=${sign.uid()})}"
               th:text="${sign.name()}">LAUSANNE</a>
            <abbr class="sign-language" th:data-language="${sign.language().code()}"
                  th:title="#{'signLanguage.' + ${sign.language().name()}}"
                  th:text="#{'signLanguage.short.' + ${sign.language().name()}}">LSF</abbr>
            <p th:if="${sign.definition() != null or sign.periphrase() != null}" class="definition"
               th:lang="${sign.language().code()}" th:text="${sign.definition() ?: sign.periphrase()}">
                Capitale du canton de Vaud</p>
            <span class="categories"><th:block th:each="category, it : ${sign.categories()}"
                >[[#{'category.' + ${category.name()}}]]<th:block th:unless="${it.last}">, </th:block></th:block></span>
            <form th:action="@{/lists/{id}/signs/{uid}/remove(id=${list.id()},uid=${sign.uid()})}" method="post"
                  class="inline">
                <button type="submit" class="small secondary outline" th:text="#{lists.remove}">Remove</button>
            </form>
        </li>
    </ul>
    <details th:replace="~{fragments/export :: export('/lists/' + ${list.id()} + '/export')}"></details>
    <p th:if="${error}" class="error" role="alert" th:text="#{${error}(${maxNameLength})}">Error</p>
    <details>
        <summary th:text="#{lists.rename}">Rename</summary>
        <form th:action="@{/lists/{id}/rename(id=${list.id()})}" method="post" class="stacked">
            <label for="name" th:text="#{lists.name}">Name</label>
            <input type="text" id="name" name="name" th:value="${list.name()}" required
                   th:maxlength="${maxNameLength}">
            <button type="submit" th:text="#{lists.rename}">Rename</button>
        </form>
    </details>
    <details>
        <summary th:text="#{lists.delete}">Delete the list</summary>
        <form th:action="@{/lists/{id}/delete(id=${list.id()})}" method="post">
            <p th:text="#{lists.deleteConfirm(${list.name()})}">Delete "Family" for good?</p>
            <button type="submit" th:text="#{lists.delete}">Delete the list</button>
        </form>
    </details>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
