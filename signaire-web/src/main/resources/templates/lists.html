<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{lists.title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main">
    <h1><span th:text="#{lists.title}">My lists</span> <a th:replace="~{fragments/help :: link('lists')}"></a></h1>
    <p th:if="${lists.isEmpty()}" th:text="#{lists.none}">You have no list yet.</p>
    <ul class="lists" th:unless="${lists.isEmpty()}">
        <li th:each="list : ${lists}">
            <a th:href="@{/lists/{id}(id=${list.id()})}" th:text="${list.name()}">Family</a>
            <span class="count" th:text="#{lists.size(${list.size()})}">2 signs</span>
        </li>
    </ul>
    <h2 th:text="#{lists.new}">New list</h2>
    <p th:if="${error}" class="error" role="alert" th:text="#{${error}(${maxNameLength})}">Error</p>
    <form th:action="@{/lists}" method="post" class="stacked">
        <label for="name" th:text="#{lists.name}">Name</label>
        <input type="text" id="name" name="name" th:value="${name}" required th:maxlength="${maxNameLength}">
        <button type="submit" th:text="#{lists.create}">Create</button>
    </form>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
