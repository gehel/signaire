<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{error.signNotFound.title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main">
    <h1 th:text="#{error.signNotFound.title}">Sign not found</h1>
    <p th:text="#{error.signNotFound.text}">This sign is not in the lexicon.</p>
    <p><a th:href="@{/}" th:text="#{sign.newSearch}">New search</a></p>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
