<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{tour.title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main" class="tour">
    <p class="count" th:text="#{tour.title} + ' · ' + ${number} + ' / ' + ${count}">Tour · 1 / 5</p>
    <h1 th:text="#{'tour.' + ${step.topic()} + '.title'}">Search signs</h1>
    <p th:text="#{'tour.' + ${step.topic()} + '.text'}">Type a word…</p>
    <p class="tour-links">
        <a th:href="${step.tryIt()}" th:text="#{tour.tryIt}">Try it</a>
        <a th:href="@{/help/{topic}(topic=${step.topic()})}" th:text="#{tour.readMore}">Read more</a>
    </p>
    <nav class="tour-steps" th:aria-label="#{tour.title}">
        <a th:if="${number > 1}" rel="prev" th:href="@{/tour/{n}(n=${number - 1})}" th:text="#{tour.previous}">
            Previous</a>
        <a th:if="${number < count}" rel="next" th:href="@{/tour/{n}(n=${number + 1})}" th:text="#{tour.next}">
            Next</a>
        <a th:if="${number == count}" th:href="@{/tour/done}" th:text="#{tour.finish}">Finish</a>
        <a th:if="${number < count}" class="skip-tour" th:href="@{/tour/done}" th:text="#{tour.skip}">Skip</a>
    </nav>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
