<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(null)}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main">
    <h1 class="visually-hidden" th:text="#{search.label}">Search a sign</h1>
    <section th:if="${welcome and tour == null}" class="welcome" aria-labelledby="welcome-title">
        <h2 id="welcome-title" th:text="#{tour.welcome.title}">Welcome to Signaire</h2>
        <p th:text="#{tour.welcome.text}">Signaire helps you learn Swiss sign languages.</p>
        <p class="tour-links">
            <a class="button" th:href="@{/tour/1}" th:text="#{tour.start}">Take the tour</a>
            <a class="button outline" th:href="@{/tour/done}" th:text="#{tour.dismiss}">No, thanks</a>
        </p>
    </section>
    <form class="search" data-tour="search" th:action="@{/}" method="get" th:hx-get="@{/}" hx-target="#results" hx-swap="outerHTML"
          hx-push-url="true" hx-trigger="submit, input delay:300ms, change">
        <p class="words">
            <label for="q" th:text="#{search.label}">Search a sign</label>
            <a th:replace="~{fragments/help :: link('search')}"></a>
            <span class="field">
                <input type="search" id="q" name="q" th:value="${q}" th:placeholder="#{search.placeholder}"
                       autofocus>
                <button type="submit" th:text="#{search.submit}">Search</button>
            </span>
        </p>
        <fieldset class="languages">
            <legend th:text="#{search.languages}">Sign languages</legend>
            <label th:each="language : ${allLanguages}">
                <input type="checkbox" name="language" th:value="${language.code()}"
                       th:checked="${languages.contains(language)}">
                <span th:text="#{'signLanguage.' + ${language.name()}}">LSF</span>
            </label>
        </fieldset>
        <p class="category">
            <label for="category" th:text="#{search.category}">Category</label>
            <select id="category" name="category">
                <option value="" th:text="#{search.allCategories}">All categories</option>
                <option th:each="category : ${allCategories}" th:value="${category.name()}"
                        th:selected="${categories.contains(category)}"
                        th:text="#{'category.' + ${category.name()}}">City</option>
            </select>
        </p>
    </form>

    <p id="add-status" th:fragment="add-status" role="status" th:text="${status}"
       th:class="${statusError} ? 'error' : 'success'"></p>

    <section id="results" th:fragment="results" aria-live="polite" data-tour="results">
        <p th:if="${results.total() == 0}" th:text="#{search.none}">No sign found.</p>
        <p th:if="${requestWord != null}">
            <a th:href="@{/requests(word=${requestWord})}" th:text="#{search.request(${requestWord})}">Request it</a>
        </p>
        <th:block th:if="${results.total() > 0}">
            <p class="count" th:text="#{search.found(${results.total()})}">1 sign found</p>
            <ul class="signs">
                <li th:each="sign : ${results.signs()}">
                    <input th:if="${userLists != null}" type="checkbox" name="uid" th:value="${sign.uid()}"
                           form="add-to-list" th:aria-label="#{search.addTo.select(${sign.name()})}">
                    <a class="name" th:href="@{/signs/{uid}(uid=${sign.uid()})}" th:text="${sign.name()}">LAUSANNE</a>
                    <abbr class="sign-language" th:data-language="${sign.language().code()}"
                          th:title="#{'signLanguage.' + ${sign.language().name()}}"
                          th:text="#{'signLanguage.short.' + ${sign.language().name()}}">LSF</abbr>
                    <a th:if="${sign.sourceUrl() != null}" class="source" th:href="${sign.sourceUrl()}"
                       rel="external" th:aria-label="#{search.signSuisse(${sign.name()})}">SignSuisse</a>
                    <span class="categories"><th:block th:each="category, it : ${sign.categories()}"
                        >[[#{'category.' + ${category.name()}}]]<th:block th:unless="${it.last}">, </th:block></th:block></span>
                </li>
            </ul>
            <!--/* The checkboxes of the results belong to this form, through their form attribute */-->
            <form th:if="${userLists != null}" id="add-to-list" class="add-to-list" method="post"
                  th:action="@{/lists/signs}" th:hx-post="@{/lists/signs}" hx-target="#add-status"
                  hx-swap="outerHTML">
                <input type="hidden" name="q" th:value="${q}">
                <input th:each="language : ${languages}" type="hidden" name="language"
                       th:value="${language.code()}">
                <input th:each="category : ${categories}" type="hidden" name="category"
                       th:value="${category.name()}">
                <label for="target-list" th:text="#{search.addTo.label}">Add to</label>
                <select id="target-list" name="list">
                    <option th:each="list : ${userLists}" th:value="${list.id()}" th:text="${list.name()}">Family</option>
                    <option value="" th:text="#{search.addTo.newList}">New list…</option>
                </select>
                <input type="text" name="newList" th:placeholder="#{search.addTo.newListName}"
                       th:aria-label="#{search.addTo.newListName}" maxlength="100">
                <button type="submit" name="scope" value="selection" th:text="#{search.addTo.selection}">
                    Add the selection</button>
                <button type="submit" name="scope" value="all" th:text="#{search.addTo.all(${allCount})}">
                    Add all the results</button>
            </form>
            <details th:replace="~{fragments/export :: export('/export')}"></details>
            <nav class="pages" th:if="${pages > 1}" th:aria-label="#{search.pages}">
                <a th:if="${page > 1}" rel="prev" th:href="${links.withPage(page - 1)}"
                   th:hx-get="${links.withPage(page - 1)}" hx-target="#results" hx-swap="outerHTML"
                   hx-push-url="true" th:text="#{search.previous}">Previous</a>
                <span th:text="#{search.page(${page}, ${pages})}">Page 1 of 2</span>
                <a th:if="${page < pages}" rel="next" th:href="${links.withPage(page + 1)}"
                   th:hx-get="${links.withPage(page + 1)}" hx-target="#results" hx-swap="outerHTML"
                   hx-push-url="true" th:text="#{search.next}">Next</a>
            </nav>
        </th:block>
    </section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
