<!DOCTYPE html>
<html th:lang="${#locale.language}" th:data-theme="${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{admin.title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main">
    <h1><span th:text="#{admin.title}">Administration</span>
        <a th:replace="~{fragments/help :: link('admin')}"></a></h1>
    <ul class="admin-menu">
        <li>
            <a th:href="@{/admin/requests}" th:text="#{admin.requests.title}">Sign requests</a>
            <span class="count" th:text="#{admin.requests.count(${openRequests})}">1 open request</span>
        </li>
        <li>
            <a th:href="@{/admin/signs}" th:text="#{admin.signs.title}">Changed signs</a>
            <span class="count" th:text="#{admin.signs.count(${changedSigns})}">2 changed signs</span>
        </li>
        <li><a th:href="@{/admin/signs/new}" th:text="#{admin.signs.new}">New sign</a></li>
        <li><a th:href="@{/admin/bundles}" th:text="#{admin.bundles.title}">Bundles</a></li>
        <li><a th:href="@{/admin/sync}" th:text="#{admin.sync.title}">Synchronization with SignSuisse</a></li>
    </ul>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
