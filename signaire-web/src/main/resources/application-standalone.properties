# The standalone application (StandaloneApplication): one computer, no server to install.
signaire.standalone.enabled=true
signaire.standalone.open-browser=true
# This computer only; the port is set by StandaloneApplication (8180, or --server.port=…)
server.address=127.0.0.1
# The accounts and lists in an H2 database, in the state directory of the user; keep the mode in line with
# H2Database (tests of signaire-accounts)
spring.datasource.url=jdbc:h2:file:${signaire.state.directory}/database/signaire;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# The choices of the first run (Standalone)
spring.config.import=optional:file:${signaire.config.directory}/standalone.properties
# Started with a double click, there is no console: the log is in the state directory
logging.file.name=${signaire.state.directory}/signaire.log
