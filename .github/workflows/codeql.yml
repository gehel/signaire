name: CodeQL

# Static analysis of security (docs/design/supply-chain.md): Java and JavaScript from their sources, and the workflows.
# Its alerts go to code scanning; SonarCloud's quality gate stays the one that fails pull requests.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the alerts to code scanning
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # from the sources, without a build: CodeQL reads the classes of the JDK and of the dependencies the POMs name
        language: [actions, java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '27'
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
