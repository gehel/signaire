name: Quality

# Measures of the web application (Lighthouse, sitespeed.io) on invented demo signs, and SonarCloud. Each fails
# the workflow when its thresholds are not met: .lighthouserc.json, .sitespeed/budget.json, the SonarCloud
# quality gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: ./mvnw -B -ntp -PnoVerify install -DskipTests
      - name: Start Signaire on demo signs
        run: ci/start-demo.sh target/demo
      - name: Lighthouse
        # no install scripts: Lighthouse CI uses the Chrome of the runner
        run: |
          npm install --global --ignore-scripts @lhci/cli@0.16.1
          lhci autorun
      - name: sitespeed.io
        run: >
          docker run --rm --network host -v "$PWD:/sitespeed.io" sitespeedio/sitespeed.io:43.0.0
          --budget.configPath .sitespeed/budget.json -n 3 --outputFolder target/sitespeed
          http://localhost:8080/ "http://localhost:8080/?q=arbre" http://localhost:8080/signs/90000
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: measures
          path: |
            target/lighthouse/
            target/sitespeed/
            target/demo/web.log

  sonarcloud:
    # needs the SONAR_TOKEN secret, which pull requests from forks don't get
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud needs the history to tell new code from old
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Analyze
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar
          -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=gehel-github -Dsonar.projectKey=gehel_signaire
          -Dsonar.qualitygate.wait=true
      - name: Not configured
        if: env.SONAR_TOKEN == ''
        run: 'echo "::notice::SonarCloud is skipped: add the SONAR_TOKEN secret to enable it"'
