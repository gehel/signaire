name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Install the Android SDK's packages
        # the runner has the SDK (ANDROID_HOME), so the android profile builds the app: its platform and build tools
        run: ci/android-sdk.sh
      - name: Build and verify
        # the build cache is for local builds; CI builds everything (see .mvn/maven-build-cache-config.xml)
        run: ./mvnw -B -ntp -Dmaven.build.cache.enabled=false verify
      - name: Upload the command line jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signaire-cli
          path: signaire-cli/target/signaire-cli-*-jar-with-dependencies.jar
          if-no-files-found: error
      - name: Upload the standalone jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signaire-standalone-jar
          path: signaire-web/target/signaire-web-*-standalone.jar
          if-no-files-found: error
      - name: Upload the Android app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signaire-android
          path: signaire-android/target/android/signaire.apk
          if-no-files-found: error
      - name: Upload the screenshots of the pages
        # taken by BrowserIT: the look of every page, to review changes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: signaire-it/target/screenshots/
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  # The Android app on an emulator of Android 14 (AndroidIT): a job of its own, as the emulator takes a while.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the Android SDK's packages
        run: ci/android-sdk.sh --emulator
      - name: Test the app on the emulator
        # the quality gates run in the build job
        run: >
          ./mvnw -B -ntp -Dmaven.build.cache.enabled=false -PnoVerify verify -pl signaire-it -am
          -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=AndroidIT -Dfailsafe.failIfNoSpecifiedTests=false
      - name: Upload the screenshots of the app
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-android
          path: signaire-it/target/screenshots/android/
          if-no-files-found: ignore
      - name: Upload the emulator's log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-log
          path: signaire-it/target/it/emulator.log
          if-no-files-found: ignore

  # The standalone application with its own Java runtime, for each system: jpackage only packages for the system
  # it runs on.
  standalone:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signaire-standalone-jar
          path: jar
      - name: Package with a Java runtime
        shell: bash
        run: ci/package-standalone.sh jar/signaire-web-*-standalone.jar package
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signaire-standalone-${{ runner.os }}
          path: package/
          if-no-files-found: error
